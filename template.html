<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="SixtyFPS GmbH" />

        <title>#MadeWithSlint</title>
        <meta name="description" content="Awesome applications built with Slint, the declarative GUI toolkit for Rust, C++, Python, and JavaScript" />
        <meta property="og:image" content="https://slint.dev/assets/img/responsive.png" />
        <meta property="og:title" content="#MadeWithSlint" />
        <meta property="og:url" content="https://madewithslint.com" />
        <meta property="og:type" content="website" />

        <link rel="shortcut icon" href="https://slint.dev/assets/img/favicon.ico">
        <link rel="icon" type="image/svg+xml" href="https://slint.dev/assets/img/favicon.svg">

        <!-- Satoshi from Fontshare's API (served by its foundry, not rehosted here);
             JetBrains Mono for the filter labels. -->
        <link rel="preconnect" href="https://api.fontshare.com">
        <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">

        <style>
            /* A standalone page: nothing here depends on slint.dev's stylesheets.
               It matches slint.dev/madewithslint -- the gallery itself (cards,
               filter, their CSS) is generated from this repo for both sites, and
               these tokens are the same names and light values slint.dev uses. */
            :root {
                --ink-2: #E8EDF1;
                --card: #FFFFFF;
                --line: rgba(18, 28, 38, 0.10);
                --line-2: rgba(18, 28, 38, 0.17);
                --text: #121A20;
                --muted: #51616B;
                --blue-ink: #0C68EB;
                --blue-cta: #1B63D6;
                --ice: #006E9F;
                --display: Satoshi, system-ui, sans-serif;
                --sans: Satoshi, system-ui, sans-serif;
                --mono: "JetBrains Mono", ui-monospace, monospace;
                --gutter: clamp(20px, 7.5vw, 120px);
            }
            *, *::before, *::after { box-sizing: border-box; }
            html { -webkit-text-size-adjust: 100%; }
            body { margin: 0; background: #F6F8FA; color: var(--text); font-family: var(--sans); font-weight: 450;
                   font-size: 16px; line-height: 1.5; font-synthesis: none; }
            img { max-width: 100%; }
            a { color: inherit; }
            .wrap { max-width: 1440px; margin: 0 auto; padding-inline: var(--gutter); }

            .skip { position: absolute; left: -9999px; top: 8px; padding: 8px 14px; background: var(--card); border-radius: 4px; }
            .skip:focus { left: 8px; z-index: 10; }
            :focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

            .top { background: #fff; border-bottom: 1px solid var(--line); }
            .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; }
            .top .logo img { display: block; height: 34px; width: auto; }
            .top nav { display: flex; align-items: center; gap: 22px; font-size: 15px; font-weight: 500; }
            .top nav a { text-decoration: none; color: var(--muted); }
            .top nav a:hover { color: var(--text); }

            .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 4px;
                   background: var(--blue-cta); color: #fff; font-weight: 600; text-decoration: none; }
            .btn:hover { background: #1857BE; }
            .btn-lg { padding: 16px 24px; font-size: 20px; }

            .hero { text-align: center; padding-block: clamp(56px, 7vw, 104px) clamp(40px, 5vw, 64px); }
            .hero h1 { margin: 0; font-family: var(--display); font-weight: 500; letter-spacing: -0.04em;
                       font-size: clamp(42px, 6.5vw, 84px); line-height: 1.05; }
            .hero p { margin: 18px auto 0; max-width: 56ch; font-size: 18px; color: var(--muted); }
            .hero .btn { margin-top: 34px; }

            .gallery { padding-bottom: clamp(64px, 8vw, 120px); }

            footer { border-top: 1px solid var(--line); background: #fff; font-size: 14px; color: var(--muted); }
            footer .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
                           padding-block: 28px; }
            footer nav { display: flex; flex-wrap: wrap; gap: 8px 22px; }
            footer a { text-decoration: none; }
            footer a:hover { color: var(--text); text-decoration: underline; }

            @media (max-width: 620px) {
                .btn-lg { padding: 14px 20px; font-size: 18px; }
            }
        </style>
    </head>

    <body>
        <a class="skip" href="#main">Skip to content</a>

        <header class="top">
            <div class="wrap">
                <a class="logo" href="https://slint.dev/"><img src="https://slint.dev/assets/img/slint-logo.svg" alt="Slint" width="141" height="47"></a>
                <nav aria-label="Main">
                    <a href="https://slint.dev/">slint.dev</a>
                    <a href="https://github.com/slint-ui/madewithslint">GitHub</a>
                </nav>
            </div>
        </header>

        <main id="main">
            <section class="hero wrap">
                <h1>#MadeWithSlint</h1>
                <a class="btn btn-lg" href="https://slint.dev/submit-application.html">Submit your app &rarr;</a>
            </section>

            <div class="gallery wrap">
                <?applications?>
            </div>
        </main>

        <footer>
            <div class="wrap">
                <span>&copy; SixtyFPS GmbH &middot; Slint is a trademark of SixtyFPS GmbH.</span>
                <nav aria-label="Footer">
                    <a href="https://slint.dev/">slint.dev</a>
                    <a href="https://github.com/slint-ui/madewithslint">Add your app on GitHub</a>
                    <a href="https://slint.dev/imprint.html">Imprint &amp; Privacy</a>
                </nav>
            </div>
        </footer>

        <!-- Matomo -->
        <script>
            var _paq = window._paq = window._paq || [];
            /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
            _paq.push(['trackPageView']);
            _paq.push(['enableLinkTracking']);
            (function () {
                var u = "https://matomo.slint.dev/";
                _paq.push(['setTrackerUrl', u + 'matomo.php']);
                _paq.push(['setSiteId', '1']);
                var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
                g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);
            })();
        </script>
        <noscript>
            <img referrerpolicy="no-referrer-when-downgrade" src="https://matomo.slint.dev/matomo.php?idsite=1&amp;rec=1" style="border:0" alt="" />
        </noscript>
        <!-- End Matomo Code -->
    </body>

</html>
